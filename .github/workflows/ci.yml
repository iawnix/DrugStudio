name: Regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-and-packaging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Installed CLI and web assets
        working-directory: /tmp
        run: |
          drugstudio --help
          python -m drugstudio.web.server --help
          python -c "from drugstudio.web.server import STATIC_ROOT; assert (STATIC_ROOT / 'index.html').is_file(); assert (STATIC_ROOT / 'app.js').is_file(); assert (STATIC_ROOT / 'preferences.js').is_file(); assert (STATIC_ROOT / 'appearance.css').is_file()"
          python -c "from drugstudio.web.server import STATIC_ROOT; import json, hashlib; assets = json.loads((STATIC_ROOT / 'vendor/manifest.json').read_text()); assert all(hashlib.sha256((STATIC_ROOT / 'vendor' / name).read_bytes()).hexdigest() == item['sha256'] for name, item in assets.items()); assert (STATIC_ROOT / 'chat-renderer.js').is_file(); assert (STATIC_ROOT / 'chat.css').is_file()"
          python -c "from pathlib import Path; import drugstudio; root = Path(drugstudio.__file__).parent; assert (root / 'scripts/run_receptor_env.sh').is_file(); assert (root / 'pbs/run_local_af3.pbs').is_file()"
      - run: python -m unittest discover -s tests -v
      - run: node --check src/drugstudio/web/static/app.js
      - run: node --check src/drugstudio/web/static/preferences.js
      - run: node --check src/drugstudio/web/static/chat-renderer.js
      - run: node --check src/drugstudio/web/static/molecular-viewer.js
      - run: node --test tests/molecular-selection.test.js
  review-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install . playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm install --prefix .runtime/viewer --no-save 3dmol@2.5.5
      - name: Review and parameter UI with real browser
        env:
          DRUGSTUDIO_REQUIRE_UI_TESTS: '1'
          DRUGSTUDIO_TEST_3DMOL: .runtime/viewer/node_modules/3dmol/build/3Dmol-min.js
          DRUGSTUDIO_UI_SCREENSHOT: output/playwright/docking-box.png
        run: |
          python - <<'PYTEST'
          import sys
          import unittest
          from pathlib import Path
          log = Path("output/playwright/browser-tests.log")
          log.parent.mkdir(parents=True, exist_ok=True)
          with log.open("w") as stream:
              suite = unittest.defaultTestLoader.discover("tests", pattern="test_*ui.py")
              result = unittest.TextTestRunner(stream=stream, verbosity=2).run(suite)
          print(log.read_text())
          for test, detail in result.errors + result.failures:
              detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={test.id()}::{detail}")
          sys.exit(0 if result.wasSuccessful() else 1)
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docking-box-render
          path: output/playwright/
          if-no-files-found: ignore
