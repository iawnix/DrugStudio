[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drugstudio"
version = "0.1.0"
description = "An agent workbench for structure-based drug discovery"
requires-python = ">=3.11"

[project.scripts]
drugstudio = "drugstudio.cli:main"
# Backward-compatible entry point for existing Dock Agent installations.
dock-agent = "drugstudio.cli:main"

[project.optional-dependencies]
orchestration = ["langchain-core>=0.3,<2", "langgraph>=0.2,<2"]
openai = ["langchain-core>=0.3,<2", "langgraph>=0.2,<2", "langchain-openai>=0.2,<2"]
chemistry = ["rdkit"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["drugstudio*"]

[tool.setuptools.package-data]
"drugstudio.web" = ["static/*"]
